version: '3.8'

services:
  airflow-init:
    build: .
    container_name: airflow_init
    environment:
      - AIRFLOW_HOME=/opt/airflow
      - PYTHONPATH=/opt/airflow
    volumes:
      - airflow_db:/opt/airflow
      - .:/opt/airflow
    command: >
      bash -c "airflow db init &&
               airflow users create --username admin --firstname Екатерина --lastname AI --role Admin --email admin@example.com --password admin"

  airflow-webserver:
    build: .
    container_name: airflow_web
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      - AIRFLOW_HOME=/opt/airflow
      - PYTHONPATH=/opt/airflow
    volumes:
      - airflow_db:/opt/airflow
      - .:/opt/airflow
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    command: >
      bash -c "airflow webserver"

  airflow-scheduler:
    build: .
    container_name: airflow_scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW_HOME=/opt/airflow
      - PYTHONPATH=/opt/airflow
    volumes:
      - airflow_db:/opt/airflow
      - .:/opt/airflow
    restart: always
    command: >
      bash -c "airflow scheduler"

volumes:
  airflow_db:
